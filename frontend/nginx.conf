upstream webapp{
    server backend:8000;
}

server {
    listen 80 default_server;
    server_name localhost;

    location / {
	    index index.html;
    }

    location /ws{
    	proxy_pass http://webapp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

